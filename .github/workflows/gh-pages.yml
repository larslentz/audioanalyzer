# GitHub Pages deployment for Lars Lentz's Audio Analyzer
#
# SETUP (one-time, do this in your GitHub repo settings):
#   1. Go to Settings → Pages
#   2. Under "Build and deployment", set Source to "Deploy from a branch"
#   3. Select branch: gh-pages  /  folder: / (root)
#   4. Save — your app will be live at https://larslentz.github.io/audioanalyzer/
#
# This workflow runs automatically on every push to main.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for GitHub Pages
        working-directory: artifacts/audio-analyzer
        run: pnpm run build:gh-pages

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: artifacts/audio-analyzer/dist-gh-pages
          publish_branch: gh-pages
          force_orphan: true
