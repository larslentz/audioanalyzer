kind = "web"
previewPath = "/"
title = "Audio Deconstructor"
version = "1.0.0"
id = "artifacts/audio-deconstructor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24535

[services.development]
run = "pnpm --filter @workspace/audio-deconstructor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/audio-deconstructor", "run", "build" ]
publicDir = "artifacts/audio-deconstructor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24535"
BASE_PATH = "/"
